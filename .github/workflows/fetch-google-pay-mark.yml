name: Fetch Google Pay brand asset (temporary)
on:
  push:
    branches: [commerce-four-step]
permissions:
  contents: read
jobs:
  fetch-brand-mark:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Retrieve official public Google Pay acceptance mark
        run: |
          curl --fail --silent --show-error --location --max-time 20 --proto '=https' --proto-redir '=https' --max-filesize 250000 https://developers.google.com/static/pay/api/images/brand-guidelines/google-pay-mark.png -o /tmp/gpay.png
          python3 - <<'PY'
          import base64, pathlib, hashlib, struct
          p=pathlib.Path('/tmp/gpay.png').read_bytes()
          assert p[:8] == b'\x89PNG\r\n\x1a\n' and 0<len(p)<250000
          print("GPAY_SHA256:"+hashlib.sha256(p).hexdigest())
          print("GPAY_DIMENSIONS:"+str(struct.unpack('>II',p[16:24])))
          b64=base64.b64encode(p).decode()
          for offset in range(0,len(b64),1000):
              print("GPAY_CHUNK:"+str(offset)+":"+b64[offset:offset+1000])
          PY
