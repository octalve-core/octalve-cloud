name: Cloud public build qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: node --experimental-strip-types --test tests/commerce-intent.test.mjs tests/typography.test.mjs tests/hero-domain.test.mjs tests/home-composition.test.mjs tests/support-page.test.mjs tests/registry-rdap.test.mjs tests/domain-workspace.test.mjs tests/domain-name-ideas.test.mjs tests/domain-bundle.test.mjs tests/compare-domain-sellers.test.mjs tests/service-hero.test.mjs tests/service-domain-search.test.mjs tests/hosting-feature-sections.test.mjs tests/email-services.test.mjs tests/server-overview.test.mjs tests/tools-directory.test.mjs tests/document-tools.test.mjs tests/public-hardening.test.mjs tests/commerce-ui.test.mjs tests/storefront-tools.test.mjs tests/domain-picker.test.mjs tests/shopping-session.test.mjs
      - run: pnpm build
      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/support/index.html
          test -f out/knowledge-base/index.html
          test -f out/tools/domain-name-search/index.html

          test -f out/hosting/index.html
          test -f out/migration/index.html
          test -f out/ssl-security/index.html
          test -f out/email/index.html

          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/contact/index.html
          test -f out/servers/index.html
          node tests/seo-export.mjs

          test -f out/tools/index.html

          test -f out/commerce-preview/index.html

      - name: Browser commerce qualification (isolated fixture transport)
        run: |
          npm install --prefix "$RUNNER_TEMP/commerce-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/commerce-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > "$RUNNER_TEMP/commerce-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          COMMERCE_PLAYWRIGHT_PATH="$RUNNER_TEMP/commerce-browser/node_modules/playwright" node tests/commerce-browser.cjs
