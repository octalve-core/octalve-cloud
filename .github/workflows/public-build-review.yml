name: Cloud public build qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: node --experimental-strip-types --test tests/commerce-intent.test.mjs tests/typography.test.mjs tests/hero-domain.test.mjs tests/home-composition.test.mjs tests/support-page.test.mjs tests/registry-rdap.test.mjs tests/domain-workspace.test.mjs tests/domain-name-ideas.test.mjs tests/domain-bundle.test.mjs tests/compare-domain-sellers.test.mjs tests/service-hero.test.mjs tests/service-domain-search.test.mjs tests/hosting-feature-sections.test.mjs tests/email-services.test.mjs tests/server-overview.test.mjs
      - run: pnpm build
      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/support/index.html
          test -f out/knowledge-base/index.html
          test -f out/tools/domain-name-search/index.html

          test -f out/hosting/index.html
          test -f out/migration/index.html
          test -f out/ssl-security/index.html
          test -f out/email/index.html
